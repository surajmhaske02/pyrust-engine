[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrust-engine"
version = "0.3.0"
description = "Experimental typed Python kernel compiler with Rust acceleration and Python fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["pyrust_engine*"]

[project.optional-dependencies]
arrays = ["numpy>=1.24"]
benchmark = ["numpy>=1.24", "numba>=0.59"]
