[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrust-engine"
version = "0.7.5"
description = "Make Python code faster with one decorator: compiles numeric Python to Rust, with exact Python fallback"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["performance", "rust", "compiler", "jit", "numpy", "pandas", "polars", "bm25", "rag", "llm", "mcp", "speed"]

[project.scripts]
pyrust-engine = "pyrust_engine.__main__:main"
pyrust-mcp = "pyrust_engine.mcp:main"

[project.urls]
Homepage = "https://github.com/surajmhaske02/pyrust-engine"
Documentation = "https://surajmhaske02.github.io/pyrust-engine/"
Changelog = "https://github.com/surajmhaske02/pyrust-engine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pyrust_engine*"]

[tool.setuptools.package-data]
pyrust_engine = ["py.typed"]

[project.optional-dependencies]
arrays = ["numpy>=1.24"]
benchmark = ["numpy>=1.24", "numba>=0.59"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/kernels*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731", "B023", "B008", "E702", "E701", "B905", "B007", "B904"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["pyrust_engine"]

[tool.coverage.run]
source = ["pyrust_engine"]
