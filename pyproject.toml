[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrust-engine"
version = "0.6.1"
description = "Make Python code faster with one decorator: compiles numeric Python to Rust, with exact Python fallback"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
include = ["pyrust_engine*"]

[tool.setuptools.package-data]
pyrust_engine = ["py.typed"]

[project.optional-dependencies]
arrays = ["numpy>=1.24"]
benchmark = ["numpy>=1.24", "numba>=0.59"]
