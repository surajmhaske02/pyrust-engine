[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrust-engine"
version = "0.1.0"
description = "Experimental Python integer-kernel compiler with Rust acceleration and Python fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["pyrust_engine*"]
