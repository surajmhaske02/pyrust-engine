# Publishes to PyPI with trusted publishing (no API token stored in GitHub).
# One-time setup by the PyPI account owner: on pypi.org, add a "pending publisher"
# for project pyrust-engine, owner surajmhaske02, repository pyrust-engine,
# workflow publish.yml, environment pypi. Then run this workflow from the Actions tab.
name: Publish to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
