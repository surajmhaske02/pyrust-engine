<text class="t2" x="313.2" y="398" text-anchor="middle">0.1×</text>
<line class="ref" x1="436.5" x2="436.5" y1="64" y2="380"/>
<text class="t2" x="436.5" y="398" text-anchor="middle">1× = Python</text>
<line class="grid" x1="559.7" x2="559.7" y1="64" y2="380"/>
