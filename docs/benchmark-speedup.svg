<line class="stem" x1="436.5" x2="453.3" y1="721.0" y2="721.0"/>
<circle class="s1 m" cx="453.3" cy="721.0" r="5"/>
<text class="val" x="463.3" y="725.0" text-anchor="start">1.37×</text>
