<line class="stem" x1="436.5" x2="695.2" y1="411.0" y2="411.0"/>
<circle class="s1 m" cx="695.2" cy="411.0" r="5"/>
<text class="val" x="705.2" y="415.0" text-anchor="start">125.7×</text>
<text class="lab" x="20" y="477.0">Recursive fib(25)</text>
<line class="stem" x1="436.5" x2="581.8" y1="473.0" y2="473.0"/>
<circle class="s1 m" cx="581.8" cy="473.0" r="5"/>
<text class="val" x="591.8" y="477.0" text-anchor="start">15.1×</text>
<text class="lab" x="20" y="539.0">Write output array (100k)</text>
<line class="stem" x1="436.5" x2="714.0" y1="535.0" y2="535.0"/>
<circle class="s1 m" cx="714.0" cy="535.0" r="5"/>
<text class="val" x="724.0" y="539.0" text-anchor="start">178.7×</text>
<text class="lab" x="20" y="601.0">Tiny add(a, b)</text>
<line class="stem" x1="436.5" x2="444.5" y1="597.0" y2="597.0"/>
<circle class="s1 m" cx="444.5" cy="597.0" r="5"/>
<text class="val" x="454.5" y="601.0" text-anchor="start">1.16×</text>
