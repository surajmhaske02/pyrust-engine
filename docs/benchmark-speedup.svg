<text class="lab" x="20" y="167.0">Float recurrence</text>
<line class="stem" x1="436.5" x2="564.6" y1="163.0" y2="163.0"/>
<circle class="s1 m" cx="564.6" cy="163.0" r="5"/>
<text class="val" x="574.6" y="167.0" text-anchor="start">11.0×</text>
<text class="lab" x="20" y="229.0">Array kernel (100k)</text>
<line class="stem" x1="436.5" x2="681.0" y1="225.0" y2="225.0"/>
<circle class="s1 m" cx="681.0" cy="225.0" r="5"/>
