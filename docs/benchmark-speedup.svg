<text class="lab" x="20" y="291.0">math.sqrt/sin/log loop</text>
<line class="stem" x1="436.5" x2="557.7" y1="287.0" y2="287.0"/>
<circle class="s1 m" cx="557.7" cy="287.0" r="5"/>
<text class="val" x="567.7" y="291.0" text-anchor="start">9.64×</text>
<text class="lab" x="20" y="353.0">Helper calls in loop</text>
<line class="stem" x1="436.5" x2="661.5" y1="349.0" y2="349.0"/>
<circle class="s1 m" cx="661.5" cy="349.0" r="5"/>
<text class="val" x="671.5" y="353.0" text-anchor="start">67.1×</text>
<text class="lab" x="20" y="415.0">Bit-mixing hash</text>
<line class="stem" x1="436.5" x2="693.2" y1="411.0" y2="411.0"/>
<circle class="s1 m" cx="693.2" cy="411.0" r="5"/>
<text class="val" x="703.2" y="415.0" text-anchor="start">121.3×</text>
<text class="lab" x="20" y="477.0">Recursive fib(25)</text>
<line class="stem" x1="436.5" x2="574.5" y1="473.0" y2="473.0"/>
<circle class="s1 m" cx="574.5" cy="473.0" r="5"/>
<text class="val" x="584.5" y="477.0" text-anchor="start">13.2×</text>
<text class="lab" x="20" y="539.0">Write output array (100k)</text>
<line class="stem" x1="436.5" x2="681.8" y1="535.0" y2="535.0"/>
<circle class="s1 m" cx="681.8" cy="535.0" r="5"/>
<text class="val" x="691.8" y="539.0" text-anchor="start">97.9×</text>
<text class="lab" x="20" y="601.0">Edit distance (strings)</text>
<line class="stem" x1="436.5" x2="580.1" y1="597.0" y2="597.0"/>
<circle class="s1 m" cx="580.1" cy="597.0" r="5"/>
<text class="val" x="590.1" y="601.0" text-anchor="start">14.6×</text>
<text class="lab" x="20" y="663.0">Tiny add(a, b)</text>
<line class="stem" x1="436.5" x2="436.6" y1="659.0" y2="659.0"/>
<circle class="s1 m" cx="436.6" cy="659.0" r="5"/>
<text class="val" x="446.6" y="663.0" text-anchor="start">1.00×</text>
<text class="lab" x="20" y="725.0">Tiny add, forced native</text>
<line class="stem" x1="436.5" x2="358.6" y1="721.0" y2="721.0"/>
<circle class="s1 m" cx="358.6" cy="721.0" r="5"/>
<text class="val" x="348.6" y="725.0" text-anchor="end">0.23×</text>
<text class="lab" x="20" y="787.0">vectorize over 100k rows</text>
<line class="stem" x1="436.5" x2="610.8" y1="783.0" y2="783.0"/>
<circle class="s1 m" cx="610.8" cy="783.0" r="5"/>
<text class="val" x="620.8" y="787.0" text-anchor="start">26.0×</text>
<text class="lab" x="20" y="849.0">Word count (dict)</text>
<line class="stem" x1="436.5" x2="452.3" y1="845.0" y2="845.0"/>
<circle class="s1 m" cx="452.3" cy="845.0" r="5"/>
<text class="val" x="462.3" y="849.0" text-anchor="start">1.35×</text>
<text class="lab" x="20" y="911.0">Method updating self.x</text>
<line class="stem" x1="436.5" x2="569.7" y1="907.0" y2="907.0"/>
<circle class="s1 m" cx="569.7" cy="907.0" r="5"/>
<text class="val" x="579.7" y="911.0" text-anchor="start">12.1×</text>
<text class="lab" x="20" y="973.0">Small array, 1000 calls</text>
<line class="stem" x1="436.5" x2="553.3" y1="969.0" y2="969.0"/>
<circle class="s1 m" cx="553.3" cy="969.0" r="5"/>
<text class="val" x="563.3" y="973.0" text-anchor="start">8.87×</text>
<text class="lab" x="20" y="1035.0">JSON → array pipeline</text>
<line class="stem" x1="436.5" x2="453.2" y1="1031.0" y2="1031.0"/>
<circle class="s1 m" cx="453.2" cy="1031.0" r="5"/>
<text class="val" x="463.2" y="1035.0" text-anchor="start">1.37×</text>
