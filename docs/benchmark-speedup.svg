<text class="lab" x="20" y="291.0">math.sqrt/sin/log loop</text>
<line class="stem" x1="436.5" x2="564.6" y1="287.0" y2="287.0"/>
<circle class="s1 m" cx="564.6" cy="287.0" r="5"/>
<text class="val" x="574.6" y="291.0" text-anchor="start">11.0×</text>
<text class="lab" x="20" y="353.0">Helper calls in loop</text>
<line class="stem" x1="436.5" x2="659.0" y1="349.0" y2="349.0"/>
<circle class="s1 m" cx="659.0" cy="349.0" r="5"/>
