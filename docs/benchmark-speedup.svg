<line class="stem" x1="436.5" x2="218.8" y1="659.0" y2="659.0"/>
<circle class="s1 m" cx="218.8" cy="659.0" r="5"/>
<text class="val" x="208.8" y="663.0" text-anchor="end">0.017×</text>
