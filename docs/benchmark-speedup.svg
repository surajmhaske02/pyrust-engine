<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1118" width="760" height="1118" role="img" aria-labelledby="t d">
<title id="t">Speedup versus plain Python (log scale)</title>
<desc id="d">Integer loop: PyRust 36.1×; Float recurrence: PyRust 11.0×; Array kernel (100k): PyRust 96.5×; math.sqrt/sin/log loop: PyRust 9.64×; Helper calls in loop: PyRust 67.1×; Bit-mixing hash: PyRust 121.3×; Recursive fib(25): PyRust 13.2×; Write output array (100k): PyRust 97.9×; Edit distance (strings): PyRust 14.6×; Tiny add(a, b): PyRust 1.00×; Tiny add, forced native: PyRust 0.23×; vectorize over 100k rows: PyRust 26.0×; Word count (dict): PyRust 1.35×; Method updating self.x: PyRust 12.1×; Small array, 1000 calls: PyRust 8.87×; JSON → array pipeline: PyRust 1.37×</desc>
<style>
.bg{fill:#fcfcfb}.t1{fill:#21201c;font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.t2{fill:#5f5e58;font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.lab{fill:#21201c;font:13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.val{fill:#5f5e58;font:11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.grid{stroke:#e6e5e0;stroke-width:1}.ref{stroke:#8c8b84;stroke-width:1.5;stroke-dasharray:4 3}
.stem{stroke:#d4d3cc;stroke-width:2;stroke-linecap:round}
.m{stroke:#fcfcfb;stroke-width:2}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1,.lab{fill:#f0efec}.t2,.val{fill:#c3c2b7}
.grid{stroke:#2e2d2a}.ref{stroke:#8c8b84}.stem{stroke:#3a3936}.m{stroke:#1a1a19}
.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}}
</style>
<rect class="bg" width="760" height="1118" rx="8"/>
<text class="t1" x="20" y="28">PyRust speedup versus plain Python — higher is faster</text>
<circle class="s1 m" cx="26.0" cy="48.0" r="5"/>
<text class="t2" x="36" y="52">PyRust</text>
<line class="grid" x1="190.0" x2="190.0" y1="64" y2="1062"/>
<text class="t2" x="190.0" y="1080" text-anchor="middle">0.01×</text>
<line class="grid" x1="313.2" x2="313.2" y1="64" y2="1062"/>
<text class="t2" x="313.2" y="1080" text-anchor="middle">0.1×</text>
<line class="ref" x1="436.5" x2="436.5" y1="64" y2="1062"/>
<text class="t2" x="436.5" y="1080" text-anchor="middle">1× = Python</text>
<line class="grid" x1="559.7" x2="559.7" y1="64" y2="1062"/>
<text class="t2" x="559.7" y="1080" text-anchor="middle">10×</text>
<line class="grid" x1="682.9" x2="682.9" y1="64" y2="1062"/>
<text class="t2" x="682.9" y="1080" text-anchor="middle">100×</text>
<text class="t2" x="720" y="1100" text-anchor="end">Log scale · median of 7 warm runs · Linux x86_64, Python 3.13.18, Rust 1.99.1</text>
<text class="lab" x="20" y="105.0">Integer loop</text>
<line class="stem" x1="436.5" x2="628.3" y1="101.0" y2="101.0"/>
<circle class="s1 m" cx="628.3" cy="101.0" r="5"/>
