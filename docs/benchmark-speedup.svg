<line class="stem" x1="436.5" x2="211.8" y1="659.0" y2="659.0"/>
<circle class="s1 m" cx="211.8" cy="659.0" r="5"/>
<text class="val" x="201.8" y="663.0" text-anchor="end">0.015×</text>
<text class="lab" x="20" y="725.0">JSON → array pipeline</text>
<line class="stem" x1="436.5" x2="455.9" y1="721.0" y2="721.0"/>
<circle class="s1 m" cx="455.9" cy="721.0" r="5"/>
<text class="val" x="465.9" y="725.0" text-anchor="start">1.44×</text>
</svg>