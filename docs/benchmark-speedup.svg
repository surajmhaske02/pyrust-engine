<text class="lab" x="20" y="415.0">Bit-mixing hash</text>
<line class="stem" x1="436.5" x2="689.1" y1="411.0" y2="411.0"/>
<circle class="s1 m" cx="689.1" cy="411.0" r="5"/>
<text class="val" x="699.1" y="415.0" text-anchor="start">112.3×</text>
<text class="lab" x="20" y="477.0">Recursive fib(25)</text>
<line class="stem" x1="436.5" x2="570.2" y1="473.0" y2="473.0"/>
<circle class="s1 m" cx="570.2" cy="473.0" r="5"/>
<text class="val" x="580.2" y="477.0" text-anchor="start">12.2×</text>
<text class="lab" x="20" y="539.0">Write output array (100k)</text>
<line class="stem" x1="436.5" x2="676.7" y1="535.0" y2="535.0"/>
<circle class="s1 m" cx="676.7" cy="535.0" r="5"/>
<text class="val" x="686.7" y="539.0" text-anchor="start">89.1×</text>
<text class="lab" x="20" y="601.0">Tiny add(a, b)</text>
<line class="stem" x1="436.5" x2="437.3" y1="597.0" y2="597.0"/>
<circle class="s1 m" cx="437.3" cy="597.0" r="5"/>
<text class="val" x="447.3" y="601.0" text-anchor="start">1.02×</text>
