<text class="t2" x="720" y="418" text-anchor="end">Log scale · median of 7 warm runs · Linux x86_64, Python 3.13, Rust 1.97 · PyRust 0.3.0</text>
<text class="lab" x="20" y="105.0">Integer loop</text>
<line class="stem" x1="436.5" x2="613.8" y1="101.0" y2="101.0"/>
