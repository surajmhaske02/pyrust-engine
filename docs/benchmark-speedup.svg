<text class="lab" x="20" y="291.0">math.sqrt/sin/log loop</text>
<line class="stem" x1="436.5" x2="562.8" y1="287.0" y2="287.0"/>
<circle class="s1 m" cx="562.8" cy="287.0" r="5"/>
