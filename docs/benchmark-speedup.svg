<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-labelledby="t d">
<title id="t">Speedup versus plain Python (log scale)</title>
<desc id="d">Integer loop: PyRust 27.5×, Numba 43.4×; Float recurrence: PyRust 4.78×, Numba 4.12×; Array kernel (100k): PyRust 40.9×, Numba 105.1×, NumPy (vectorised) 90.2×; Tiny add(a, b): PyRust 0.016×, Numba 0.30×; JSON → array pipeline: PyRust 1.35×</desc>
<style>
.bg{fill:#fcfcfb}.t1{fill:#21201c;font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.t2{fill:#5f5e58;font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
